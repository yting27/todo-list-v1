name: sleekflow-todo-js

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:-todo_local_password}@postgres:5432/${POSTGRES_DB:-todo}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_IDLE_DAYS: ${SESSION_IDLE_DAYS:-7}
  SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-30}
  AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
  AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-900}

x-api-image: &api-image
  image: sleekflow-todo-api:local

services:
  postgres:
    image: postgres:18.6-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo}
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["node", "apps/api/dist/scripts/migrate.js", "up"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-environment
      API_PORT: ${API_PORT:-8080}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${API_PORT:-8080}/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

  relay:
    <<: *api-image
    command: ["node", "apps/api/dist/relay.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: sleekflow-todo-web:local
    ports:
      - "${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seed:
    <<: *api-image
    command: ["node", "apps/api/dist/scripts/seed.js"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: [tools]
    restart: "no"

volumes:
  postgres-data:
  redis-data:
