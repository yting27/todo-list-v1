name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://todo:todo_test_password@127.0.0.1:5432/todo_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run migrate
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: docker compose config --quiet
      - run: docker build -f apps/api/Dockerfile -t todo-api:test .
      - run: docker build -f apps/web/Dockerfile -t todo-web:test .
      - name: Compose smoke test
        env:
          POSTGRES_PORT: 55432
          REDIS_PORT: 56379
          WEB_PORT: 33000
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:33000/health/ready && break
            if [ "$attempt" -eq 30 ]; then docker compose logs; exit 1; fi
            sleep 2
          done
          docker compose run --rm seed
          curl --fail --silent http://127.0.0.1:33000/api/openapi.yaml | grep -q "openapi: 3.1.0"
          docker compose down --volumes
